services:
  market-bot:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: market_bot_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=8000
      - TZ=UTC
    volumes:
      - ./dados:/app/dados
      - ./logs:/app/logs
      - ./features:/app/features
      - ${ML_MODELS_PATH_HOST:-./ml/models}:/app/ml/models:ro
    # Configuração de recursos (ajuste conforme instância OCI)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
